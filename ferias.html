<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Férias da equipe · Escala EVR</title>
  <link rel="stylesheet" href="ferias.css?v=3" />
</head>
<body>
  <header><strong>ESCALA EVR</strong><span id="page-label">Férias da equipe</span><button id="refresh" type="button">Atualizar</button></header>
  <main>
    <p id="status" role="status" aria-live="polite">Carregando equipe...</p>
    <form id="admin-login" hidden>
      <h1>Administrar restrições</h1>
      <label>Senha administrativa<input id="admin-password" type="password" autocomplete="current-password" required /></label>
      <button class="primary" type="submit">Entrar</button>
    </form>
    <section id="selection"><h1>Quem é você?</h1><div id="people" class="people"></div></section>
    <section id="workspace" hidden>
      <div class="heading"><h1 id="person-name"></h1><button id="change-person" type="button">Trocar pessoa</button></div>
      <div class="columns">
        <section>
          <div class="heading"><h2 id="list-title">Minhas férias</h2><label>Competência <input id="year" type="number" min="2000" max="2100" /></label></div>
          <div id="admin-filters" class="dates" hidden>
            <label>Exibir<select id="scope"><option value="active">Vigentes e futuras</option><option value="all">Todas, inclusive anteriores</option><option value="month">Mês do calendário</option></select></label>
            <label>Tipo<select id="filter-type"><option value="all">Todos</option><option>Férias</option><option>Curso</option><option>Atestado</option><option>Outro impedimento</option><option>Feriado</option></select></label>
          </div>
          <p id="balance"></p><div id="vacations"></div>
          <form id="vacation-form">
            <h2 id="form-title">Novo período</h2>
            <label id="type-field" hidden>Tipo<select id="type"><option>Férias</option><option>Curso</option><option>Atestado</option><option>Outro impedimento</option><option>Feriado</option></select></label>
            <label id="person-field" hidden>Pessoa<select id="person"></select></label>
            <label id="period-field">Período<select id="period" required><option value="1">1º período</option><option value="2">2º período</option><option value="3">3º período</option></select></label>
            <div class="dates"><label>Início<input id="start" type="date" required /></label><label>Término<input id="end" type="date" required /></label></div>
            <label id="note-field" hidden><span id="note-label">Observação</span><input id="note" type="text" /></label>
            <p id="preview" aria-live="polite"></p>
            <div class="actions"><button id="save" class="primary" type="submit">Salvar minhas férias</button><button id="cancel" type="button" hidden>Cancelar edição</button></div>
          </form>
        </section>
        <section>
          <div class="heading"><h2 id="calendar-title">Férias da equipe</h2><label>Mês <input id="month" type="month" /></label></div>
          <div id="calendar" class="calendar"></div>
        </section>
      </div>
    </section>
  </main>
  <script src="ferias.js?v=3"></script>
</body>
</html>
